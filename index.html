<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Notes App</title>

    <!-- Style css -->
    <link rel="stylesheet" href="./src/assets/css/style.css" />

    <!-- Material Google -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <header>
      <app-bar></app-bar>
    </header>

    <main>
      <section class="add-form" id="add-form">
        <h2>
          <span class="material-symbols-outlined"> add_circle </span>
          Create New Note
        </h2>
        <note-form></note-form>
      </section>

      <section class="my-notes" id="my-notes">
        <h2>
          <span class="material-symbols-outlined"> notes </span>
          My Notes
        </h2>
        <note-list filter="active"></note-list>
      </section>

      <section class="my-notes-archived" id="my-notes-archived">
        <h2>
          <span class="material-symbols-outlined"> bookmark </span>
          My Notes (Archived)
        </h2>
        <note-list filter="archived"></note-list>
      </section>
    </main>

    <footer>
      <footer-bar></footer-bar>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
